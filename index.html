<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>カロリー記録</title>
  <style>
    :root {
      --bg: #0f1420;
      --card: #1c2333;
      --card2: #252d40;
      --text: #f5f7fb;
      --muted: #9aa4b8;
      --line: #384258;
      --green: #48d17a;
      --green2: #243d33;
      --yellow: #d7a900;
      --danger: #ff6b6b;
      --cyan: #20c7c9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #0f1420 0%, #121827 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px 14px 40px;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 18px;
    }

    .eyebrow {
      color: var(--green);
      font-weight: 800;
      letter-spacing: 0.12em;
      font-size: 13px;
    }

    h1 {
      margin: 6px 0 4px;
      font-size: 30px;
    }

    h2 {
      margin: 8px 0 10px;
      font-size: 24px;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      background: rgba(28, 35, 51, 0.96);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    label {
      display: block;
      color: var(--muted);
      font-weight: 700;
      margin: 14px 0 8px;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card2);
      color: var(--text);
      border-radius: 18px;
      padding: 15px 16px;
      font-size: 18px;
      outline: none;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    .meal-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .meal-btn {
      border: 1px solid var(--line);
      background: var(--card2);
      color: var(--text);
      border-radius: 999px;
      padding: 12px 4px;
      font-size: 15px;
      font-weight: 800;
    }

    .meal-btn.active {
      background: var(--green2);
      border-color: var(--green);
      color: var(--green);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .unit-wrap {
      position: relative;
    }

    .unit {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 800;
      font-size: 16px;
      pointer-events: none;
    }

    .unit-wrap input {
      padding-right: 56px;
      font-weight: 800;
    }

    .save {
      width: 100%;
      border: 0;
      background: var(--green);
      color: #08120d;
      border-radius: 22px;
      padding: 18px;
      margin-top: 18px;
      font-size: 20px;
      font-weight: 900;
    }

    .save:disabled,
    .secondary:disabled {
      opacity: 0.6;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-weight: 700;
      min-height: 24px;
      line-height: 1.5;
      word-break: break-word;
    }

    .status.ok {
      color: var(--green);
    }

    .status.ng {
      color: var(--danger);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .secondary {
      border: 1px solid var(--green);
      color: var(--green);
      background: transparent;
      border-radius: 999px;
      padding: 13px;
      font-weight: 800;
      font-size: 15px;
    }

    .secondary.cyan {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .toggle-title {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 900;
      text-align: left;
    }

    #favoritesArrow {
      color: var(--green);
      font-size: 20px;
      width: 24px;
      flex: 0 0 24px;
    }

    .favorites-panel {
      margin-top: 14px;
    }

    .favorite-search {
      margin-top: 12px;
      margin-bottom: 12px;
    }

    .favorites {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .favorite-btn {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--card2);
      color: var(--text);
      border-radius: 18px;
      padding: 14px;
      font-size: 15px;
      line-height: 1.5;
    }

    .favorite-name {
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .favorite-macro {
      color: var(--muted);
      font-weight: 700;
    }

    .pill {
      display: inline-block;
      color: var(--green);
      background: var(--green2);
      border: 1px solid rgba(72, 209, 122, 0.55);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      margin-left: 6px;
    }

    .totals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .total-box {
      border: 1px solid var(--line);
      background: var(--card2);
      border-radius: 22px;
      padding: 14px;
      min-height: 110px;
    }

    .total-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .total-value {
      font-size: 28px;
      font-weight: 900;
    }

    .target {
      margin-top: 8px;
      color: var(--yellow);
      font-weight: 800;
      text-align: right;
    }

    .history {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .history-item {
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="eyebrow">CALORIE LOG</div>
      <h1>食事記録</h1>
      <div class="sub">GitHub Pages → GAS → Notion DB</div>
    </div>

    <section class="card">
      <div class="eyebrow">INPUT</div>

      <label>食事区分</label>
      <div class="meal-buttons">
        <button class="meal-btn active" type="button" data-meal="朝食">朝食</button>
        <button class="meal-btn" type="button" data-meal="昼食">昼食</button>
        <button class="meal-btn" type="button" data-meal="夕食">夕食</button>
        <button class="meal-btn" type="button" data-meal="間食">間食</button>
      </div>

      <label for="food">食べたもの</label>
      <textarea id="food" placeholder="例：ご飯250g、卵2個、納豆、プロテイン"></textarea>

      <div class="grid">
        <div>
          <label for="calories">カロリー</label>
          <div class="unit-wrap">
            <input id="calories" type="number" inputmode="decimal" placeholder="0">
            <span class="unit">kcal</span>
          </div>
        </div>

        <div>
          <label for="protein">タンパク質</label>
          <div class="unit-wrap">
            <input id="protein" type="number" inputmode="decimal" step="0.1" placeholder="0">
            <span class="unit">g</span>
          </div>
        </div>

        <div>
          <label for="fat">脂質</label>
          <div class="unit-wrap">
            <input id="fat" type="number" inputmode="decimal" step="0.1" placeholder="0">
            <span class="unit">g</span>
          </div>
        </div>

        <div>
          <label for="carbs">炭水化物</label>
          <div class="unit-wrap">
            <input id="carbs" type="number" inputmode="decimal" step="0.1" placeholder="0">
            <span class="unit">g</span>
          </div>
        </div>
      </div>

      <button id="saveBtn" class="save" type="button">食事を保存</button>

      <div class="actions">
        <button id="saveFavoriteBtn" class="secondary" type="button">お気に入り登録</button>
        <button id="refreshFavoritesBtn" class="secondary cyan" type="button">お気に入り更新</button>
      </div>

      <div id="status" class="status"></div>
    </section>

    <section class="card">
      <button id="favoritesToggle" class="toggle-title" type="button">
        <span id="favoritesArrow">▶</span>
        <span>お気に入り食材</span>
      </button>

      <div id="favoritesPanel" class="favorites-panel" hidden>
        <div class="sub">タップすると入力欄に反映します。選択後は自動で閉じます。</div>

        <input
          id="favoriteSearch"
          class="favorite-search"
          type="search"
          placeholder="お気に入りを検索"
        >

        <div id="favorites" class="favorites"></div>
      </div>
    </section>

    <section class="card">
      <div class="eyebrow">TODAY</div>
      <h1>今日の合計</h1>

      <div class="totals">
        <div class="total-box">
          <div class="total-label">カロリー</div>
          <div class="total-value"><span id="totalCalories">0</span> kcal</div>
          <div class="target">2547 kcal</div>
        </div>

        <div class="total-box">
          <div class="total-label">タンパク質</div>
          <div class="total-value"><span id="totalProtein">0</span> g</div>
          <div class="target">180 g</div>
        </div>

        <div class="total-box">
          <div class="total-label">脂質</div>
          <div class="total-value"><span id="totalFat">0</span> g</div>
          <div class="target">70 g</div>
        </div>

        <div class="total-box">
          <div class="total-label">炭水化物</div>
          <div class="total-value"><span id="totalCarbs">0</span> g</div>
          <div class="target">300 g</div>
        </div>
      </div>

      <div class="actions">
        <button id="clearLocalBtn" class="secondary" type="button">今日の表示をリセット</button>
      </div>

      <div id="history" class="history"></div>
    </section>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbz3vYVAXkntz1Qq4g99k2U-fsxZQ7cV-sybjqL2zXM2LEGE97apSjHz9ccTEJ2DejyM/exec';

    let selectedMeal = '朝食';
    let favoritesCache = [];
    let favoritesOpen = false;
    let favoriteSearchText = '';

    const todayKey = () => {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };

    const numberValue = (id) => {
      const value = document.getElementById(id).value;
      return value === '' ? 0 : Number(value);
    };

    const setStatus = (message, type = '') => {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = type ? `status ${type}` : 'status';
    };

    const getCurrentInput = () => {
      const food = document.getElementById('food').value.trim();

      return {
        date: todayKey(),
        mealType: selectedMeal,
        type: '食事',
        food,
        name: food,
        calories: numberValue('calories'),
        protein: numberValue('protein'),
        fat: numberValue('fat'),
        carbs: numberValue('carbs')
      };
    };

    const fillInput = (item) => {
      document.getElementById('food').value = item.name || '';
      document.getElementById('calories').value = item.calories || '';
      document.getElementById('protein').value = item.protein || '';
      document.getElementById('fat').value = item.fat || '';
      document.getElementById('carbs').value = item.carbs || '';

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });

      setStatus(`${item.name} を入力欄に入れました。`, 'ok');
    };

    const getLogs = () => {
      return JSON.parse(localStorage.getItem('calorieLogs') || '[]');
    };

    const saveLogs = (logs) => {
      localStorage.setItem('calorieLogs', JSON.stringify(logs));
    };

    const renderTotals = () => {
      const today = todayKey();
      const logs = getLogs().filter(log => log.date === today);

      const total = logs.reduce((sum, log) => {
        sum.calories += Number(log.calories || 0);
        sum.protein += Number(log.protein || 0);
        sum.fat += Number(log.fat || 0);
        sum.carbs += Number(log.carbs || 0);
        return sum;
      }, { calories: 0, protein: 0, fat: 0, carbs: 0 });

      document.getElementById('totalCalories').textContent = Math.round(total.calories);
      document.getElementById('totalProtein').textContent = total.protein.toFixed(1).replace('.0', '');
      document.getElementById('totalFat').textContent = total.fat.toFixed(1).replace('.0', '');
      document.getElementById('totalCarbs').textContent = total.carbs.toFixed(1).replace('.0', '');

      const history = document.getElementById('history');

      history.innerHTML = logs.slice().reverse().map(log => `
        <div class="history-item">
          <strong>${log.mealType}</strong>：${escapeHtml(log.food || '')}<br>
          ${log.calories} kcal / P ${log.protein}g / F ${log.fat}g / C ${log.carbs}g
        </div>
      `).join('');
    };

    const renderFavorites = () => {
      const box = document.getElementById('favorites');
      const keyword = favoriteSearchText.trim().toLowerCase();

      const filtered = favoritesCache.filter(item => {
        const name = String(item.name || '').toLowerCase();
        const memo = String(item.memo || '').toLowerCase();
        return !keyword || name.includes(keyword) || memo.includes(keyword);
      });

      if (!filtered.length) {
        box.innerHTML = '<div class="sub">該当するお気に入りがありません。</div>';
        return;
      }

      box.innerHTML = filtered.map((item, index) => `
        <button class="favorite-btn" type="button" data-index="${index}">
          <div class="favorite-name">
            ${escapeHtml(item.name)}
            <span class="pill">${item.calories || 0} kcal</span>
          </div>
          <div class="favorite-macro">
            P ${item.protein || 0}g / F ${item.fat || 0}g / C ${item.carbs || 0}g
          </div>
          ${item.memo ? `<div class="favorite-macro">${escapeHtml(item.memo)}</div>` : ''}
        </button>
      `).join('');

      document.querySelectorAll('.favorite-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = Number(btn.dataset.index);
          fillInput(filtered[index]);
          setFavoritesOpen(false);
        });
      });
    };

    const setFavoritesOpen = (open) => {
      favoritesOpen = open;

      const panel = document.getElementById('favoritesPanel');
      const arrow = document.getElementById('favoritesArrow');

      panel.hidden = !favoritesOpen;
      arrow.textContent = favoritesOpen ? '▼' : '▶';
    };

    const escapeHtml = (str) => {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    };

    const postToGas = async (payload) => {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      return await res.json();
    };

    const loadFavorites = async () => {
      try {
        setStatus('お気に入りを読み込み中...');

        const result = await postToGas({
          action: 'getFavorites'
        });

        if (!result.ok) {
          throw new Error(JSON.stringify(result));
        }

        favoritesCache = result.favorites || [];
        renderFavorites();
        setStatus('お気に入りを更新しました。', 'ok');

      } catch (error) {
        console.error(error);
        setStatus('お気に入りの読み込みに失敗しました。', 'ng');
      }
    };

    document.querySelectorAll('.meal-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.meal-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMeal = btn.dataset.meal;
      });
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const saveBtn = document.getElementById('saveBtn');
      const data = getCurrentInput();

      if (!data.food) {
        setStatus('食べたものを入力してください。', 'ng');
        return;
      }

      saveBtn.disabled = true;
      setStatus('保存中...');

      try {
        const result = await postToGas({
          action: 'saveMeal',
          ...data
        });

        if (!result.ok) {
          throw new Error(JSON.stringify(result));
        }

        const logs = getLogs();
        logs.push(data);
        saveLogs(logs);

        document.getElementById('food').value = '';
        document.getElementById('calories').value = '';
        document.getElementById('protein').value = '';
        document.getElementById('fat').value = '';
        document.getElementById('carbs').value = '';

        renderTotals();
        setStatus('Notionに保存しました。', 'ok');

      } catch (error) {
        console.error(error);
        setStatus('保存に失敗しました。GAS URLやNotion設定を確認してください。', 'ng');

      } finally {
        saveBtn.disabled = false;
      }
    });

    document.getElementById('saveFavoriteBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveFavoriteBtn');
      const data = getCurrentInput();

      if (!data.food) {
        setStatus('お気に入り名として、食べたものを入力してください。', 'ng');
        return;
      }

      btn.disabled = true;
      setStatus('お気に入り登録中...');

      try {
        const result = await postToGas({
          action: 'saveFavorite',
          name: data.food,
          calories: data.calories,
          protein: data.protein,
          fat: data.fat,
          carbs: data.carbs,
          memo: ''
        });

        if (!result.ok) {
          throw new Error(JSON.stringify(result));
        }

        setStatus('お気に入りに登録しました。', 'ok');

        await loadFavorites();
        setFavoritesOpen(true);

      } catch (error) {
        console.error(error);
        setStatus('お気に入り登録に失敗しました。', 'ng');

      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('refreshFavoritesBtn').addEventListener('click', async () => {
      setFavoritesOpen(true);
      await loadFavorites();
    });

    document.getElementById('favoritesToggle').addEventListener('click', async () => {
      setFavoritesOpen(!favoritesOpen);

      if (favoritesOpen && favoritesCache.length === 0) {
        await loadFavorites();
      }
    });

    document.getElementById('favoriteSearch').addEventListener('input', (e) => {
      favoriteSearchText = e.target.value;
      renderFavorites();
    });

    document.getElementById('clearLocalBtn').addEventListener('click', () => {
      const today = todayKey();
      const logs = getLogs().filter(log => log.date !== today);
      saveLogs(logs);
      renderTotals();
    });

    renderTotals();
    setFavoritesOpen(false);
  </script>
</body>
</html>
